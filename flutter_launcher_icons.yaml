# The app's launcher icon and the web app's icons, made from assets/icon by `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#a1b4f8"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#181922"
    theme_color: "#181922"
