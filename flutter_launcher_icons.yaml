# The app's launcher icon, made from assets/icon by `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#4B5DC3"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  # The foreground is drawn to the safe zone already, so the plugin adds no inset of its own.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24
