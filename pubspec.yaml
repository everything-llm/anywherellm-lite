name: anywherellm
description: "A lightweight Android front end for an AnythingLLM server."
publish_to: 'none'
version: 1.14.0+29

# Pinned by series. Rolling forward is a deliberate edit to this file.
environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ">=13.1.0 <13.2.0"
  cross_file: ">=0.3.5 <0.4.0"
  path_drawing: ">=1.0.1 <1.1.0"
  http: ">=1.6.0 <1.7.0"
  flutter_secure_storage: ">=11.2.0 <11.3.0"
  path_provider: ">=2.1.0 <2.2.0"
  flutter_markdown_plus: ">=1.0.12 <1.1.0"
  flutter_math_fork: ">=0.7.4 <0.8.0"
  re_highlight: ">=0.0.3 <0.1.0"
  markdown: ">=7.3.1 <7.4.0"
  url_launcher: ">=6.3.2 <6.4.0"
  mobile_scanner: ">=7.4.2 <7.5.0"
  speech_to_text: ">=7.5.0 <7.6.0"
  flutter_tts: ">=4.2.5 <4.3.0"
  characters: ">=1.4.0 <1.5.0"
  clock: ">=1.1.0 <1.2.0"
  share_plus: ">=13.3.1 <13.4.0"
  image_picker: ">=1.2.0 <1.3.0"
  webview_flutter: ">=4.14.1 <4.15.0"
  webview_flutter_android: ">=4.14.1 <4.15.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0 <6.1.0"
  file_picker_platform_interface: ">=4.0.0 <4.1.0"
  flutter_launcher_icons: ">=0.14.4 <0.15.0"
  flutter_native_splash: ">=2.4.8 <2.5.0"

flutter:
  uses-material-design: true
  # SIL OFL; the licence texts sit beside the fonts.
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
