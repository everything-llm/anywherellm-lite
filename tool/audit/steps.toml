# The walk `audit.py` makes of the app, in order. Each [[step]] launches the app afresh (the fakes
# are in memory, so every launch starts from the same sample data), runs the actions of the start
# its `from` names, then its own `do` actions, and takes a screenshot at the end, or at each
# `shot`, once in each theme. A control is found by its accessibility label, or an empty field
# by its hint: `uv run tool/audit/audit.py --try "tap Chats; tap Settings"` prints the labels it
# finds.
#
#   tap LABEL        tap the control whose label is LABEL (exact, then ignoring case, then as a
#                    start, then as a part); scrolls up to four times to find it
#   hold LABEL       long press
#   type TEXT        type into the focused field
#   swipe WAY        up, down, left or right across the middle of the screen
#   wait LABEL       wait until LABEL shows
#   sleep SECONDS
#   intent ARGS      `adb shell am ARGS`, with {pkg} for the app's id
#   shot [NAME]      a screenshot, named after the step and NAME
#
# `signed_out = true` runs the step on a build with no server saved. `state = "unreachable"` or
# `"unsent"` runs it on a build whose fakes start in that state (`tool/audit_app.dart`).

# Where steps start.
[from]
settings = ["tap Chats", "tap Settings"]
workspace = ["tap Chats", "tap Workspace settings"]
documents = ["tap Chats", "tap Workspace settings", "tap Documents"]
q3 = ["tap Chats", "tap Workspace: Household", "tap Q3 planning"]

